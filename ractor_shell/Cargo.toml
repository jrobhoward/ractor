[package]
name = "ractor_shell"
version = "0.1.0"
edition = "2021"
authors = ["Sean Lawlor", "Evan Au", "Dillon George"]
description = "Interactive REPL for Ractor actor systems, inspired by Erlang's erl shell"
license = "MIT"
repository = "https://github.com/slawlor/ractor"
keywords = ["actor", "ractor", "shell", "repl", "debugging"]
categories = ["command-line-utilities", "development-tools::debugging"]

[features]
default = ["sysinfo"]
sysinfo = ["dep:sysinfo"]

[[bin]]
name = "ractor-shell"
path = "src/main.rs"

[dependencies]
# Workspace members - use local paths
ractor = { path = "../ractor", features = ["cluster", "blanket_serde", "shell-introspection"] }
ractor_cluster = { path = "../ractor_cluster" }

# External dependencies
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
rustyline = "14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.15"
colored = "2"
thiserror = "1"
anyhow = "1"  # Used in main.rs and examples for top-level error handling
dirs = "5"
hostname = "0.3"
chrono = "0.4"
toml = "0.8"
terminal_size = "0.3"

# TUI dependencies for `top` command
ratatui = "0.29"
crossterm = "0.28"
dashmap = "6"

# System info (optional, for process stats in `top`)
sysinfo = { version = "0.32", optional = true }

# Tracing dependencies
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
glob-match = "0.2"

# Raft dependencies
rand = "0.9"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
serial_test = "3"

[[bench]]
name = "shell_bench"
harness = false
